<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Load Test</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1220;color:#edf3ff;font-family:system-ui,sans-serif;padding:24px}.card{width:100%;max-width:560px;background:#151f31;border:1px solid #29394f;border-radius:22px;padding:36px;box-shadow:0 25px 80px #0004}.tag{font-size:11px;letter-spacing:2px;color:#5eead4}h1{font-size:30px;margin:12px 0 8px}p{color:#9fadc3;font-size:14px;line-height:1.6}label{display:block;font-size:14px;margin:24px 0 9px}input{width:100%;padding:15px;border-radius:10px;border:1px solid #35445d;background:#0c1423;color:#fff;font-size:15px;outline:none}input:focus{border-color:#5eead4;box-shadow:0 0 0 3px #5eead420}button{width:100%;padding:16px;background:#5eead4;color:#082720;border:0;border-radius:10px;font-size:16px;font-weight:750;margin-top:26px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.note{font-size:12px;margin-top:16px}.result{border-top:1px solid #2a3a52;margin-top:24px;padding-top:18px}#status{font-size:14px;color:#b8c8df;white-space:pre-wrap}progress{width:100%;height:7px;accent-color:#5eead4}.metrics{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:12px;color:#aabbd0}.metrics strong{display:block;font-size:20px;color:#fff;margin-bottom:4px}#error{color:#fda4af;font-size:13px;white-space:pre-wrap}input:disabled{opacity:.6}
</style></head><body><main class="card"><div class="tag">SERVER LOAD LAB</div><h1>URL Load Test</h1><p>Nhập URL, chọn số request và bắt đầu.</p>
<form id="form"><label for="url">URL đang deploy</label><input id="url" type="url" required placeholder="https://your-app.vercel.app/" autocomplete="off">
<label for="count">Số lượng request</label><input id="count" type="number" min="1" max="1000" step="1" value="100" required>
<button id="start" type="submit">Start</button></form>
<p class="note">Chỉ GET tới URL public bạn sở hữu hoặc được phép kiểm thử (Vercel, Render, …). Không test localhost. Tối đa 10 request/giây · 5 request đồng thời.</p>
<div id="error" role="alert"></div><section class="result" aria-live="polite"><div id="status">Sẵn sàng</div><progress id="progress" max="100" value="0"></progress><div class="metrics"><div><strong id="done">0 / 0</strong>Hoàn tất</div><div><strong id="errors">0</strong>Lỗi</div><div><strong id="latency">0 ms</strong>Độ trễ p95</div></div></section></main>
<script>
const $=id=>document.getElementById(id),secret='__CSRF__';let running=false,pending=false;
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':secret,'X-Local-Token':secret},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Không thực hiện được');return data}
function controls(){ $('start').textContent=running?'Stop':'Start';$('start').disabled=pending;$('url').disabled=running||pending;$('count').disabled=running||pending; }
$('form').onsubmit=async e=>{e.preventDefault();if(pending)return;pending=true;controls();$('error').textContent='';try{if(running)await post('/api/stop',{});else await post('/api/start',{url:$('url').value.trim(),count:Number($('count').value)});await poll()}catch(e){$('error').textContent=e.message}finally{pending=false;controls()}};
async function poll(){try{const r=await fetch('/api/status');if(!r.ok)throw Error('Không đọc được trạng thái');const s=await r.json();running=s.running;const n=s.config.count||0;$('status').textContent=s.reason+(s.sent?' · '+s.elapsed+'s':'');$('done').textContent=s.summary.count+' / '+n;$('errors').textContent=s.summary.errors;$('latency').textContent=s.summary.p95_ms+' ms';$('progress').max=n||1;$('progress').value=s.summary.count;controls()}catch(e){$('status').textContent='Mất kết nối máy chủ. '+e.message}}
async function loop(){await poll();setTimeout(loop,700)}loop();
</script></body></html>
